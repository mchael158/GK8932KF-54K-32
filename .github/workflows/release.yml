name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p sentinel-cli --target ${{ matrix.target }}
      - name: Archive binary
        shell: bash
        run: |
          mkdir dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/chronos-sentinel.exe" "dist/chronos-sentinel-${{ matrix.name }}.exe"
          else
            cp "target/${{ matrix.target }}/release/chronos-sentinel" "dist/chronos-sentinel-${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-sentinel-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
